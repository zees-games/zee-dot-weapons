[plugin]

name="zee-gs-weapons"
description="A weapons pack for the Gamespice platform: twenty-six weapons as gs-weapon catalogue rows, plus the half gs-weapon deliberately leaves out — a first-person view model with arms, a third-person world model, procedural animation driven by the arsenal's own signals, and the replication that makes another player's weapon look right. Depends on gs-core, gs-combat and gs-weapon; everything else is duck-typed."
author="gamemann"
version="0.1.0"
script="zee_weapons_plugin.gd"

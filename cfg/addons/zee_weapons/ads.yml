# Aiming down sights (ZeeAdsRules). Override on a server in cfg/server/addons/zee_weapons/ads.yml.
# aim_time and zoom of 0 take the weapon's own art; zoom is a field-of-view multiplier;
# view_scale multiplies the gun's hip size, view_shift_* moves it (metres, view space).
ads:
  default:
    enabled: true
    aim_time: 0.0
    zoom: 0.0
    move_speed_multiplier: 0.8
    spread_multiplier: 0.6
    recoil_multiplier: 0.6
    sway_multiplier: 0.5
    toggle: false
    # quick scope: the aim-in progress (0 to 1) from which a shot is allowed (0 any time, 1 only fully aimed, the old rule);
    # the scope's black surround fades in from scope_fade_start, and the lens grows from scope_lens_min of its size.
    quickscope_fire_min: 0.0
    scope_fade_start: 0.6
    scope_lens_min: 0.3
    view_scale: 2.0
    view_shift_x: 0.12
    view_shift_y: -0.10
    view_shift_z: -0.15
    hip_cant: 0.3
    hip_lean: 25.0
    # the hip barrel crosses the crosshair this many metres out; 0 stands it up by hip_lean instead
    hip_zero: 20.0
    thrown_span: 0.31
    # radius in degrees of a glowing dot on a gun's own front post, shown as the aim arrives; 0 draws none
    sight_dot: 0.15
    # half-angle in degrees of the cone round the aim line cut out of the gun's mesh, so iron sights and optics are see-through
    sight_cut: 2.0
    # a red-dot optic (also a weapon's art `sight: red_dot`): lens half-angle and dot size in degrees, glow multiplier, colour
    red_dot: false
    red_dot_window: 4.0
    red_dot_size: 0.25
    red_dot_brightness: 4.0
    red_dot_color: "#ff2a1a"
    # the gun nears a wall: reach multiplies the drawn length (1 = the gun's real length), margin is the gap kept (m),
    # stiffness/damping the spring, push/nudge the back and up/sideways strength, max the deepest pull (m),
    # floor_look the degrees you must look down before the floor counts (0 = always), lean the strength of the tilt away from
    # where the gun meets the wall, spread (m) how far around the muzzle that is sampled, lean_rate (1/s) how fast it eases
    wall_reach: 1.0
    wall_margin: 0.03
    wall_stiffness: 160.0
    wall_damping: 20.0
    wall_push: 1.0
    wall_nudge: 0.6
    wall_max: 0.34
    wall_floor_look: 40.0
    wall_lean: 1.0
    wall_spread: 0.1
    wall_lean_rate: 10.0
    # strafe sway per gun: tilt, yaw, aimed and response multipliers; -1 (the default) leaves the server's mp_vm_strafe_* value in charge
    strafe_tilt: -1
    strafe_yaw: -1
    strafe_aimed: -1
    strafe_response: -1
# A weapon override lists only what it changes, by weapon id (the sidearms are drawn nearer the middle, so smaller):
  weapons:
    sniper:
      # the scope snaps in (seconds); raise it for a slower zoom
      aim_time: 0.08
      view_scale: 1.6
    pistol:
      view_scale: 1.9
      view_shift_x: 0.04
    revolver:
      view_scale: 1.9
      view_shift_x: 0.04
    machine_pistol:
      view_scale: 1.9
      view_shift_x: 0.04
    derringer:
      view_scale: 3.2
      view_shift_x: 0.04

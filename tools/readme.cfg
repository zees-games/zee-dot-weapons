; tools/gen_readme.sh: how the README's studio shots are made (tools/readme_shot.gd) and where the text comes from.
; [shot] model_script/model_method: the pack's own art call, model(id) -> Node3D; or model_glob "res://.../{id}.glb".
; yaw/tilt/elevation/fill/fov are the default hero angle; [pose] "<id>.<key>" overrides one weapon
; (base = Vector3 rotation in degrees that lays the bare model muzzle toward -X before the yaw).
; hide = comma-separated node-name globs left out of the shot (e.g. detached add-on parts).
; tilt turns it about its own long axis (a blade seen edge-on wants 90), roll about the view axis.
[shot]
model_script="res://tools/readme_model.gd"
model_method="instantiate"
yaw=28.0
elevation=12.0
fill=0.84
fov=24.0
supersample=2
; ids with no model to shoot (bare hands)
skip=["fists"]

[look]
exposure=1.0
ambient=0.55
key=2.2
fill=0.7
rim=1.8

[pose]
